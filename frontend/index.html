<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NVAS CAPTCHA Demo</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="header">
        <div class="header-container">
            <div class="header-left">
                <img src="assets/images/uidai_english_logo.dd2d2a1cdbf8dcd226664631cb383029.svg" alt="UIDAI Logo" class="emblem">
                <div class="header-text">
                    <span class="title">nvasCAPTCHA</span>
                    <span class="subtitle">Not an official government website</span>
                </div>
            </div>
            <div class="header-right">
                <img src="assets/images/aadhaar_english_logo.9a2d63795a7f7bdd7acb2148585336be.svg" alt="Aadhaar Logo" class="aadhaar-logo">
            </div>
        </div>
    </header>

    <main class="main-content">
        <h1 class="page-title">Login to Aadhaar via OTP</h1>
        <div class="login-card">
            <div class="card-top-line"></div>
            <div class="card-body">
                <div class="input-group">
                    <div class="input-wrapper">
                        <input type="text" id="aadhaar-number" class="floating-input" placeholder=" " maxlength="12">
                        <label class="floating-label" for="aadhaar-number">Enter Aadhaar Number</label>
                    </div>
                    <div class="error-text">
                        <svg class="info-icon" viewBox="0 0 24 24" width="12" height="12"><path fill="currentColor" d="M11,9H13V7H11M12,20C7.59,20 4,16.41 4,12C4,7.59 7.59,4 12,4C16.41,4 20,7.59 20,12C20,16.41 16.41,20 12,20M12,2A10,10 0 0,0 2,12A10,10 0 0,0 12,22A10,10 0 0,0 22,12A10,10 0 0,0 12,2M11,17H13V11H11V17Z" /></svg>
                        This is a required field and valid data to be entered.
                    </div>
                </div>

                <div class="input-group captcha-group">
                    <div class="captcha-input-wrapper">
                        <div class="input-wrapper">
                            <input type="text" id="captcha-input" class="floating-input" placeholder=" ">
                            <label class="floating-label" for="captcha-input">Enter Captcha</label>
                        </div>
                        <div class="error-text">
                            <svg class="info-icon" viewBox="0 0 24 24" width="12" height="12"><path fill="currentColor" d="M11,9H13V7H11M12,20C7.59,20 4,16.41 4,12C4,7.59 7.59,4 12,4C16.41,4 20,7.59 20,12C20,16.41 16.41,20 12,20M12,2A10,10 0 0,0 2,12A10,10 0 0,0 12,22A10,10 0 0,0 22,12A10,10 0 0,0 12,2M11,17H13V11H11V17Z" /></svg>
                            This is a required field and valid data to be entered.
                        </div>
                    </div>
                    <div class="captcha-display">
                        <div class="captcha-image">
                            <!-- Placeholder for CAPTCHA image -->
                            <span>3 e x 4 f</span>
                        </div>
                        <div class="captcha-actions">
                            <button type="button" class="icon-btn" aria-label="Audio Captcha">
                                <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M14,3.23V5.29C16.89,6.15 19,8.83 19,12C19,15.17 16.89,17.84 14,18.7V20.77C18,19.86 21,16.28 21,12C21,7.72 18,4.14 14,3.23M16.5,12C16.5,10.23 15.5,8.71 14,7.97V16C15.5,15.29 16.5,13.76 16.5,12M3,9V15H7L12,20V4L7,9H3Z" /></svg>
                            </button>
                            <button type="button" class="icon-btn" aria-label="Refresh Captcha">
                                <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M17.65,6.35C16.2,4.9 14.21,4 12,4A8,8 0 0,0 4,12A8,8 0 0,0 12,20C15.73,20 18.84,17.45 19.73,14H17.65C16.83,16.33 14.61,18 12,18A6,6 0 0,1 6,12A6,6 0 0,1 12,6C13.66,6 15.14,6.69 16.22,7.78L13,11H20V4L17.65,6.35Z" /></svg>
                            </button>
                        </div>
                    </div>
                </div>

                <button type="button" id="login-btn" class="login-btn" disabled>Login With OTP</button>
            </div>
        </div>
    </main>

    <footer class="footer">
        <p>Copyright © 2026 nvasCAPTCHA. All Rights Reserved.</p>
    </footer>

    <script src="js/app.js"></script>
</body>
</html>
